name: "Release dev container Features"
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  gate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Validate devcontainer-feature.json files"
        uses: devcontainers/action@v1
        with:
          validate-only: "true"
          base-path-to-features: "./src"

      - name: "Shell syntax check"
        run: |
          for f in src/*/install.sh; do
            sh -n "$f"
          done

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test 'ocaml' (fast gate)"
        run: |
          devcontainer features test --skip-scenarios -f ocaml -i debian:bookworm .
          devcontainer features test -f ocaml --skip-autogenerated --skip-duplicated .

  publish:
    needs: gate
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      ocaml_version: ${{ steps.version.outputs.version }}
      ocaml_major: ${{ steps.version.outputs.major }}
    steps:
      - uses: actions/checkout@v7

      - name: "Read ocaml Feature version"
        id: version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("src/ocaml/devcontainer-feature.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"

      - name: "Publish Features"
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    needs: publish
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.publish.outputs.ocaml_version }}
      MAJOR: ${{ needs.publish.outputs.ocaml_major }}
    steps:
      - name: "Wait for exact version to resolve"
        run: |
          ref="ghcr.io/thecbah/ocaml-features/ocaml:${VERSION}"
          for i in $(seq 1 20); do
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "resolved: $ref"
              exit 0
            fi
            echo "waiting for $ref ($i/20)"
            sleep 15
          done
          echo "::error::$ref never resolved" >&2
          exit 1

      - name: "Build fixture against exact version"
        run: |
          mkdir -p fixture/.devcontainer
          cat > fixture/.devcontainer/devcontainer.json <<EOF
          {
            "image": "mcr.microsoft.com/devcontainers/base:ubuntu",
            "features": {
              "ghcr.io/thecbah/ocaml-features/ocaml:${VERSION}": {}
            }
          }
          EOF
          npm install -g @devcontainers/cli
          devcontainer up --workspace-folder fixture
          devcontainer exec --workspace-folder fixture bash -lc 'opam --version && ocamlc -version'

      - name: "Resolve floating major tag"
        run: |
          exact_digest=$(docker manifest inspect "ghcr.io/thecbah/ocaml-features/ocaml:${VERSION}" | sha256sum)
          major_digest=$(docker manifest inspect "ghcr.io/thecbah/ocaml-features/ocaml:${MAJOR}" | sha256sum)
          test "$exact_digest" = "$major_digest"
