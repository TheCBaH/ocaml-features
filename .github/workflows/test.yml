name: "CI - Test Features"
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        baseImage:
          - alpine:3.24
          - debian:bookworm
          - fedora:44
          - ubuntu:noble
    steps:
      - uses: actions/checkout@v7

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for 'ocaml' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ocaml -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - minimal
          - non_root_user
          - optional_packages
          - packages_pinned
          - pin_packages
          - repositories
          - system_packages
          - version_option
          - version_overrides_match
          - version_overrides_nomatch
    steps:
      - uses: actions/checkout@v7

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing 'ocaml' scenario '${{ matrix.scenario }}'"
        run: devcontainer features test -f ocaml --filter ${{ matrix.scenario }} --skip-autogenerated --skip-duplicated .

  test-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
