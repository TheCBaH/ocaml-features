name: "CI - Test Features"
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        baseImage:
          - debian:bookworm
          - ubuntu:noble
    steps:
      - uses: actions/checkout@v7

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for 'ocaml' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ocaml -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for 'ocaml' scenarios"
        run: devcontainer features test -f ocaml --skip-autogenerated --skip-duplicated .

  test-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
